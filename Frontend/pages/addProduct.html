<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product</title>
    <link rel="stylesheet" href="../styles/adminDashboard.css" />
    <link rel="stylesheet" href="../styles/addProduct.css" />
  </head>
  <body>
    <div class="adminNav">
      <nav class="sidebar-container">
        <div class="menu-items">
          <a href="adminDashboard.html">Manage Products</a>
          <a href="manageUser.html">Manage Users</a>
          <a href="manageOrders.html">Manage Orders</a>
          <a href="manageCategory.html">Manage Categories</a>
        </div>
        <footer class="admin-footer">
          <p class="user-greeting">Hello, Admin</p>
          <button class="logout-btn" onclick="logout()">Log Out</button>
        </footer>
      </nav>
    </div>

    <div class="main-content">
      <header class="dashboard-header">
        <h1>Add New Product</h1>
      </header>

      <div class="form-card">
        <form id="createProductForm">
          <div class="input-group">
            <label for="productName">Product Name</label>
            <input
              type="text"
              id="productName"
              placeholder="e.g., Wireless Mouse"
              required
            />
          </div>

          <div class="input-group">
            <label for="productCategory">Category</label>
            <select id="productCategory" required>
              <option value="" disabled selected>Loading categories...</option>
            </select>
          </div>

          <div class="input-group">
            <label for="productStock">Stock</label>
            <input
              type="number"
              id="productStock"
              placeholder="0"
              step="0.01"
              required
            />
          </div>

          <div class="input-group">
            <label for="productPrice">Price</label>
            <input
              type="number"
              id="productPrice"
              placeholder="0.00"
              step="0.01"
              required
            />
          </div>

          <div class="input-group">
            <label for="productImage">Image URL</label>
            <input
              type="url"
              id="productImage"
              placeholder="https://..."
              required
            />
          </div>

          <div class="button-group">
            <button
              type="button"
              class="cancel-btn"
              onclick="window.location.href = 'adminDashboard.html'"
            >
              Cancel
            </button>
            <button type="submit" class="save-btn" id="submitBtn">
              Save Product
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="../js/global.js"></script>
    <script src="../js/addProduct.js"></script>
  </body>
</html>
