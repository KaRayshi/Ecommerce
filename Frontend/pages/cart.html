<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart</title>
    <link rel="stylesheet" href="../styles/home.css" />
    <link rel="stylesheet" href="../styles/cart.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="nav-left">
          <a href="../pages/home.html">Home</a>
          <a href="../pages/products.html">Products</a>
        </div>
        <div class="nav-right">
          <a href="../pages/cart.html">Cart</a>
          <a href="../pages/orders.html">Orders</a>

          <a href="../pages/login.html" id="navLoginBtn" style="display: none"
            >Login</a
          >

          <div
            class="account-menu-container"
            id="navAccountMenu"
            style="display: none"
          >
            <button id="accountBtn" class="account-btn">Account ▼</button>
            <div id="accountDropdown" class="dropdown-content">
              <a href="../pages/userEditProfile.html">Profile</a>
              <button onclick="logout()" class="dropdown-logout-btn">
                Logout
              </button>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main class="cart-layout">
      <div class="cart-items-section">
        <h2>Shopping Cart</h2>
        <hr />
        <div id="cartItemsContainer">
          <p>Loading your cart...</p>
        </div>
      </div>

      <div class="cart-summary-section">
        <h2>Summary</h2>
        <hr />
        <div class="summary-row">
          <span>Total Items:</span>
          <span id="totalItemsCount">0</span>
        </div>
        <div class="summary-row total-row">
          <span>Total Price:</span>
          <span id="totalPriceAmount">$0.00</span>
        </div>
        <button class="checkout-btn" onclick="checkout()">
          Proceed to Checkout
        </button>
      </div>
    </main>
    <script src="../js/global.js"></script>
    <script src="../js/userCart.js"></script>
  </body>
</html>
